[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamess-lsp"
version = "0.1.0"
description = "Language Server Protocol for GAMESS input files"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "pygls>=1.2.0,<2.0.0",
    "lsprotocol>=2023.0.0,<2025.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0,<7.0",
    "black>=23.0,<26.0",
    "isort>=5.12.0,<7.0",
    "flake8>=6.0,<8.0",
    "mypy>=1.0,<2.0",
    "bandit>=1.7.0,<2.0",
    "safety>=2.3.0,<4.0",
    "pre-commit>=3.0,<5.0",
]

[project.scripts]
gamess-lsp = "gamess_lsp.server:main"
gamess-lsp-tool = "gamess_lsp.tool:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gamess_lsp"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=gamess_lsp --cov-report=term-missing --cov-report=html -v"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/gamess_lsp"]
branch = true
omit = ["*/tests/*", "*/test_*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
    "..."
]

